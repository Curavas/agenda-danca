<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#db2777">
  <title>Agenda da Escola de Dança</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--dark:#172033;--pink:#db2777;--pink2:#fce7f3;--red:#dc2626;--green:#15803d;--shadow:0 8px 22px rgba(15,23,42,.07)}
    *{box-sizing:border-box} body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}
    button,input,select{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .header,.wrap{max-width:1500px;margin:auto;padding:16px 20px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;background:var(--pink);color:#fff;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.top-actions,.nav,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 13px;font-weight:700}.btn:hover{background:#f8fafc}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.status{font-size:12px;color:var(--muted)}.drive-disconnected{background:#dc2626!important;color:#fff!important;border-color:#b91c1c!important;animation:driveShake 1.8s ease-in-out infinite,drivePulse 1.2s ease-in-out infinite}.drive-connected{background:#dcfce7!important;color:#166534!important;border-color:#86efac!important;animation:none!important}.drive-connecting{background:#fef3c7!important;color:#92400e!important;border-color:#fcd34d!important;animation:drivePulse 1.2s ease-in-out infinite}@keyframes drivePulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.18)}50%{box-shadow:0 0 0 7px rgba(220,38,38,0)}}@keyframes driveShake{0%,86%,100%{transform:translateX(0)}89%{transform:translateX(-3px)}92%{transform:translateX(3px)}95%{transform:translateX(-2px)}98%{transform:translateX(2px)}}
    .wrap{padding-top:20px}.nav{margin-bottom:18px}.tab-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px}.active{box-shadow:0 0 0 2px var(--dark)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{font-size:24px;margin:0}.toolbar p{margin:3px 0 0;color:var(--muted)}
    label{font-weight:700;font-size:12px}.field{border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;background:#fff;color:var(--text);outline:none}.field:focus{border-color:#f472b6;box-shadow:0 0 0 3px #fce7f3}.field.block{width:100%;margin-top:5px}
    .grid-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.demand-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.pill{background:var(--pink2);color:#9d174d;border-radius:100px;padding:5px 10px;font-weight:800}.person{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#f8fafc;border-radius:10px;margin-top:7px}.person a{color:#475467;text-decoration:none}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:16px;background:#fff}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}table{border-collapse:collapse;min-width:1100px;width:100%}th{background:#f1f5f9;text-align:left;padding:12px;position:sticky;top:0;z-index:3}th:first-child{left:0;z-index:5}td{min-width:170px;height:113px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:7px;vertical-align:top;cursor:pointer}td:hover{background:#fafafa}.time{position:sticky;left:0;z-index:2;min-width:86px;background:#fff;border-top:1px solid var(--line);padding:12px;vertical-align:top}.cell-person{position:relative;background:#f1f5f9;border-radius:9px;padding:7px 25px 7px 8px;margin-bottom:5px;font-size:12px}.cell-person b,.cell-person span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell-person span{color:var(--muted)}.x{position:absolute;right:5px;top:5px;border:0;background:transparent;color:var(--red);font-weight:900}.add-hint{height:82px;display:grid;place-items:center;color:#98a2b3;font-size:12px}.selected{background:#fce7f3!important;box-shadow:inset 0 0 0 2px #ec4899}
    .auto{margin-bottom:14px;border:1px solid #f9a8d4;background:#fdf2f8;border-radius:16px;padding:14px}.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px}.modal{background:#fff;border-radius:18px;width:min(480px,100%);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}.modal h3{margin:0;font-size:19px}.modal .close{float:right;border:0;background:transparent;font-size:24px}.stack{display:grid;gap:12px;margin-top:18px}.manage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.manage-item{display:flex;gap:8px;align-items:center;background:#f8fafc;border-radius:12px;padding:10px}.manage-item .field{min-width:0;flex:1}.color{width:42px;height:38px;border:0;background:transparent}.notice{font-size:12px;color:var(--muted);margin-top:10px}.cloud-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:13px;margin-top:12px}.conflict-box{background:#fff7ed;border:1px solid #fdba74;border-radius:14px;padding:13px;margin:12px 0}.conflict-list{max-height:180px;overflow:auto;background:#f8fafc;border-radius:10px;padding:10px;font-size:12px}.sync-warning{position:fixed;left:18px;bottom:18px;z-index:70;background:#fff7ed;color:#9a3412;border:1px solid #fdba74;border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);display:none}.sync-warning.show{display:block}.config-code{font-family:ui-monospace,SFMono-Regular,monospace;font-weight:400}.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#172033;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow)}
    @media(max-width:760px){.header{align-items:flex-start}.top-actions{justify-content:flex-end}.status{width:100%;text-align:right}.grid-cards,.manage-grid{grid-template-columns:1fr}.brand p{display:none}.wrap,.header{padding-left:12px;padding-right:12px}.toolbar h2{font-size:21px}.person{display:block}.person a{display:block;margin-top:3px}}
  </style>
</head>
<body>
<header><div class="header"><div class="brand"><div class="logo">♫</div><div><h1>Agenda da Escola</h1><p>Interessados por modalidade e horário</p></div></div><div class="top-actions"><span id="saveStatus" class="status">Salvo neste navegador</span><button class="btn drive-disconnected" id="cloudBtn">⚠ Conectar Google Drive</button><button class="btn" id="backupBtn">↧ Backup</button></div></div></header>
<main class="wrap">
  <nav class="nav" id="nav"></nav>
  <section id="manage" class="card hidden"></section>
  <section id="content"></section>
</main>
<div id="modal"></div><div id="toast" class="toast hidden"></div><div id="syncWarning" class="sync-warning"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const TIMES=['05:00','05:30','06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30','23:00'];
const STORAGE='agenda-escola-danca-v1', DRIVE_FILE='agenda-escola-danca.json', BACKUP_PREFIX='agenda-backup-', BACKUP_INTERVAL=10*60*1000;
const initial={tabs:[{id:'ballet',name:'Ballet Clássico',color:'#ec4899'},{id:'jazz',name:'Jazz',color:'#8b5cf6'}],entries:{}};
let data=load(), view='dashboard', active=data.tabs[0]?.id, minimum=2, autoMode=false, selected=[], manageOpen=false, editing=null;
let cloud={clientId:localStorage.getItem('agenda-google-client-id')||'',token:sessionStorage.getItem('agenda-drive-token')||null,fileId:sessionStorage.getItem('agenda-drive-file-id')||null,expiresAt:+sessionStorage.getItem('agenda-drive-expires-at')||0,connected:false,saving:false,tokenClient:null,backupFileId:sessionStorage.getItem('agenda-backup-file-id')||null,backupBucket:+sessionStorage.getItem('agenda-backup-bucket')||null,backups:[]};
const DEVICE_ID=localStorage.getItem('agenda-device-id')||uid();localStorage.setItem('agenda-device-id',DEVICE_ID);let baseSnapshot=structuredClone(data),baseRevision=Number(data._sync?.revision||0),pendingConflict=null,hasUnsavedChanges=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now();
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||structuredClone(initial)}catch{return structuredClone(initial)}}
function persist(sync=true){hasUnsavedChanges=true;localStorage.setItem(STORAGE,JSON.stringify(data));$('#saveStatus').textContent=cloud.connected?'Salvo localmente • verificando alterações':'Salvo somente neste navegador';if(sync&&cloud.connected)debouncedDriveSave();}
let saveTimer;function debouncedDriveSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveDrive,900)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function setCloudUI(state){const b=$('#cloudBtn');if(!b)return;b.classList.remove('drive-disconnected','drive-connected','drive-connecting');if(state==='connected'){b.classList.add('drive-connected');b.textContent='✓ Google Drive sincronizado';$('#saveStatus').textContent='Sincronizado com Google Drive'}else if(state==='connecting'){b.classList.add('drive-connecting');b.textContent='↻ Conectando ao Google Drive';$('#saveStatus').textContent='Verificando Google Drive...'}else{b.classList.add('drive-disconnected');b.textContent=cloud.clientId?'⚠ Reconectar Google Drive':'⚠ Conectar Google Drive';$('#saveStatus').textContent='Google Drive desconectado'}}
function rememberCloudSession(r){cloud.token=r.access_token;cloud.expiresAt=Date.now()+(+r.expires_in||3600)*1000-60000;sessionStorage.setItem('agenda-drive-token',cloud.token);sessionStorage.setItem('agenda-drive-expires-at',String(cloud.expiresAt))}
function clearCloudSession(){cloud.token=null;cloud.fileId=null;cloud.expiresAt=0;cloud.connected=false;['agenda-drive-token','agenda-drive-file-id','agenda-drive-expires-at','agenda-backup-file-id','agenda-backup-bucket'].forEach(x=>sessionStorage.removeItem(x));cloud.backupFileId=null;cloud.backupBucket=null;setCloudUI('disconnected')}
async function restoreCloudSession(){if(!cloud.clientId||!cloud.token||Date.now()>=cloud.expiresAt)return clearCloudSession();setCloudUI('connecting');try{cloud.connected=true;await findDriveFile();if(cloud.fileId)await loadDrive(false);setCloudUI('connected')}catch(e){console.error(e);clearCloudSession()}}


function cleanForCompare(value){const x=structuredClone(value||{});if(x&&typeof x==='object')delete x._sync;return x}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function ensureSync(doc){doc=doc&&typeof doc==='object'?doc:{tabs:[],entries:{}};doc._sync=doc._sync||{revision:0,updatedAt:null,updatedBy:null};return doc}
function entityMap(arr=[]){return new Map(arr.map(x=>[x.id,x]))}
function mergeEntityArrays(base=[],local=[],remote=[],label='item'){
 const B=entityMap(base),L=entityMap(local),R=entityMap(remote),ids=new Set([...B.keys(),...L.keys(),...R.keys()]),out=[],conflicts=[];
 for(const id of ids){const b=B.get(id),l=L.get(id),r=R.get(id);
  if(l&&r){if(same(l,r))out.push(l);else if(b&&same(l,b))out.push(r);else if(b&&same(r,b))out.push(l);else{out.push(l);conflicts.push(`${label} ${l.name||id}: alterado de formas diferentes`)}}
  else if(l&&!r){if(!b)out.push(l);else if(!same(l,b)){out.push(l);conflicts.push(`${label} ${l.name||id}: alterado localmente e excluído no Drive`)}}
  else if(!l&&r){if(!b)out.push(r);else if(!same(r,b)){out.push(r);conflicts.push(`${label} ${r.name||id}: excluído localmente e alterado no Drive`)}}
 }
 return{items:out,conflicts}
}
function mergeDocuments(base,local,remote){base=ensureSync(structuredClone(base));local=ensureSync(structuredClone(local));remote=ensureSync(structuredClone(remote));const tabMerge=mergeEntityArrays(base.tabs,local.tabs,remote.tabs,'Modalidade');const keys=new Set([...Object.keys(base.entries||{}),...Object.keys(local.entries||{}),...Object.keys(remote.entries||{})]),entries={},conflicts=[...tabMerge.conflicts];for(const k of keys){const m=mergeEntityArrays(base.entries?.[k]||[],local.entries?.[k]||[],remote.entries?.[k]||[],'Cliente');if(m.items.length)entries[k]=m.items;conflicts.push(...m.conflicts.map(x=>`${k}: ${x}`))}return{merged:{tabs:tabMerge.items,entries,_sync:remote._sync},conflicts}}
async function fetchDriveDocument(){if(!cloud.fileId)return null;const r=await api(`https://www.googleapis.com/drive/v3/files/${cloud.fileId}?alt=media`);return ensureSync(await r.json())}
function showExternalChange(message){const el=$('#syncWarning');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),7000)}
function openConflictDialog(result,remote){pendingConflict={result,remote};$('#modal').innerHTML=`<div class="modal-bg"><div class="modal"><h3>Alterações simultâneas detectadas</h3><div class="conflict-box">Outra pessoa atualizou a agenda depois que esta tela foi carregada. O programa combinou automaticamente as alterações independentes e bloqueou a sobrescrita silenciosa.</div>${result.conflicts.length?`<p><b>${result.conflicts.length} conflito(s) que exigem decisão:</b></p><div class="conflict-list">${result.conflicts.map(x=>`• ${esc(x)}`).join('<br>')}</div>`:'<p>As alterações são compatíveis e podem ser agregadas com segurança.</p>'}<div class="stack"><button class="btn dark" id="mergeConflict">Mesclar e sincronizar</button><button class="btn" id="reloadConflict">Descartar minha cópia e carregar o Drive</button><button class="btn" id="backupConflict">Salvar minha cópia como backup e carregar o Drive</button><button class="btn" id="cancelConflict">Cancelar e revisar depois</button></div></div></div>`;$('#mergeConflict').onclick=resolveMerge;$('#reloadConflict').onclick=resolveReload;$('#backupConflict').onclick=resolveBackup;$('#cancelConflict').onclick=()=>{pendingConflict=null;closeModal();toast('Sincronização cancelada. Suas mudanças continuam salvas neste navegador.')}}
async function resolveMerge(){if(!pendingConflict)return;data=ensureSync(pendingConflict.result.merged);baseSnapshot=structuredClone(pendingConflict.remote);baseRevision=Number(pendingConflict.remote._sync?.revision||0);pendingConflict=null;closeModal();localStorage.setItem(STORAGE,JSON.stringify(data));await saveDrive(true);render();toast('Alterações combinadas e sincronizadas.')}
function acceptRemote(remote){data=ensureSync(structuredClone(remote));baseSnapshot=structuredClone(data);baseRevision=Number(data._sync?.revision||0);hasUnsavedChanges=false;localStorage.setItem(STORAGE,JSON.stringify(data));active=data.tabs[0]?.id;pendingConflict=null;closeModal();render();setCloudUI('connected')}
async function resolveReload(){if(!pendingConflict)return;acceptRemote(pendingConflict.remote);toast('Versão do Google Drive carregada.')}
async function resolveBackup(){if(!pendingConflict)return;try{await createDriveJson(`${BACKUP_PREFIX}conflito-local-${new Date().toISOString().replace(/[:.]/g,'-')}.json`,{format:'agenda-pulsarte-backup-v1',createdAt:new Date().toISOString(),reason:'conflict-local-copy',data});const remote=pendingConflict.remote;acceptRemote(remote);toast('Sua cópia foi preservada em backup e a versão do Drive foi carregada.')}catch(e){console.error(e);toast('Não foi possível criar o backup da cópia local.')}}

function key(tab,day,time){return `${tab}|${day}|${time}`}
function render(){renderNav();$('#manage').classList.toggle('hidden',!manageOpen);if(manageOpen)renderManage();view==='dashboard'?renderDashboard():view==='backups'?renderBackups():renderSchedule()}
function renderNav(){const nav=$('#nav');nav.innerHTML=`<button class="btn ${view==='dashboard'?'active dark':''}" data-view="dashboard">▦ Visão geral</button><button class="btn ${view==='backups'?'active dark':''}" data-view="backups">⟲ Backups</button>`+data.tabs.map(t=>`<button class="btn ${view==='schedule'&&active===t.id?'active':''}" data-tab="${t.id}"><i class="tab-dot" style="background:${t.color}"></i>${esc(t.name)}</button>`).join('')+`<button class="btn" id="addTab">＋</button><button class="btn" id="manageBtn">⚙</button>`;nav.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;autoMode=false;selected=[];render()}));nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;view='schedule';autoMode=false;selected=[];render()});$('#addTab').onclick=()=>{manageOpen=true;render();setTimeout(()=>$('#newTabName')?.focus(),0)};$('#manageBtn').onclick=()=>{manageOpen=!manageOpen;render()}}
function renderManage(){const el=$('#manage');el.innerHTML=`<div class="toolbar"><div><h2>Gerenciar modalidades</h2><p>Altere nomes e cores, ou crie novas abas.</p></div><button class="btn" id="closeManage">Fechar</button></div><div class="manage-grid">${data.tabs.map(t=>`<div class="manage-item"><input class="color" type="color" value="${t.color}" data-color="${t.id}"><input class="field" value="${esc(t.name)}" data-name="${t.id}"><button class="btn danger small" data-del="${t.id}">Excluir</button></div>`).join('')}</div><div class="row" style="margin-top:14px"><input id="newTabName" class="field" placeholder="Nova modalidade"><input id="newTabColor" class="color" type="color" value="#14b8a6"><button class="btn dark" id="createTab">Adicionar modalidade</button></div>`;$('#closeManage').onclick=()=>{manageOpen=false;render()};el.querySelectorAll('[data-name]').forEach(i=>i.onchange=()=>{data.tabs.find(t=>t.id===i.dataset.name).name=i.value.trim()||'Sem nome';persist();render()});el.querySelectorAll('[data-color]').forEach(i=>i.oninput=()=>{data.tabs.find(t=>t.id===i.dataset.color).color=i.value;persist();render()});el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteTab(b.dataset.del));$('#createTab').onclick=()=>{const name=$('#newTabName').value.trim();if(!name)return toast('Digite o nome da modalidade.');const id=uid(),color=$('#newTabColor').value;data.tabs.push({id,name,color});active=id;view='schedule';manageOpen=false;persist();render()}}
function deleteTab(id){if(data.tabs.length===1)return toast('É necessário manter pelo menos uma modalidade.');if(!confirm('Excluir esta modalidade e todos os interessados dela?'))return;data.tabs=data.tabs.filter(t=>t.id!==id);Object.keys(data.entries).filter(k=>k.startsWith(id+'|')).forEach(k=>delete data.entries[k]);if(active===id)active=data.tabs[0].id;persist();render()}
function renderDashboard(){const items=Object.entries(data.entries).filter(([,p])=>p.length>=minimum).map(([k,p])=>{const [tabId,day,time]=k.split('|');return{k,tab:data.tabs.find(t=>t.id===tabId),day,time,people:p}}).filter(x=>x.tab).sort((a,b)=>b.people.length-a.people.length);$('#content').innerHTML=`<div class="toolbar"><div><h2>Horários com maior interesse</h2><p>Identifique rapidamente onde há demanda para formar turmas.</p></div><label>Mínimo de clientes <input id="minimum" class="field" type="number" min="1" value="${minimum}" style="width:75px;margin-left:8px"></label></div><div class="grid-cards">${items.map(x=>`<article class="card"><div class="demand-head"><div><b><i class="tab-dot" style="background:${x.tab.color}"></i>${esc(x.tab.name)}</b><div style="color:var(--muted);margin-top:4px">${x.day}, ${x.time}</div></div><span class="pill">${x.people.length} clientes</span></div><div style="margin-top:12px">${x.people.map(p=>`<div class="person"><b>${esc(p.name)}</b><a href="https://wa.me/55${digits(p.phone)}" target="_blank">${esc(p.phone)}</a></div>`).join('')}</div></article>`).join('')||'<div class="empty">Nenhum horário atende ao filtro selecionado.</div>'}</div>`;$('#minimum').oninput=e=>{minimum=Math.max(1,+e.target.value||1);renderDashboard()}}
function digits(s){return String(s).replace(/\D/g,'').replace(/^55/,'')}
function renderSchedule(){const tab=data.tabs.find(t=>t.id===active)||data.tabs[0];if(!tab){view='dashboard';return render()}$('#content').innerHTML=`<div class="toolbar"><div><h2>${esc(tab.name)}</h2><p>${autoMode?'Informe o cliente e selecione todos os horários desejados.':'Clique em uma célula para adicionar interessados.'}</p></div><button class="btn ${autoMode?'pink':''}" id="autoBtn">✦ Preenchimento automático</button></div>${autoMode?`<div class="auto"><div class="row"><label>Nome<input id="autoName" class="field block" placeholder="Nome completo"></label><label>Telefone<input id="autoPhone" class="field block" placeholder="(11) 99999-9999"></label><b id="selectedCount">${selected.length} selecionados</b><button class="btn pink" id="applyAuto">Preencher horários</button></div></div>`:''}<div class="table-wrap"><table><thead><tr><th>Horário</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${TIMES.map(time=>`<tr><th class="time">${time}</th>${DAYS.map(day=>cell(tab.id,day,time)).join('')}</tr>`).join('')}</tbody></table></div>`;$('#autoBtn').onclick=()=>{autoMode=!autoMode;selected=[];renderSchedule()};document.querySelectorAll('td[data-cell]').forEach(td=>td.onclick=e=>{if(e.target.closest('[data-remove]'))return;if(autoMode){td.classList.toggle('selected');selected=selected.includes(td.dataset.cell)?selected.filter(k=>k!==td.dataset.cell):[...selected,td.dataset.cell];$('#selectedCount').textContent=`${selected.length} selecionados`}else openPersonModal(td.dataset.cell)});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();removePerson(b.dataset.cell,b.dataset.remove)});$('#applyAuto')?.addEventListener('click',applyAuto)}
function cell(tab,day,time){const k=key(tab,day,time),people=data.entries[k]||[];return `<td data-cell="${k}" class="${selected.includes(k)?'selected':''}">${people.map(p=>`<div class="cell-person"><b>${esc(p.name)}</b><span>${esc(p.phone)}</span><button class="x" title="Remover" data-cell="${k}" data-remove="${p.id}">×</button></div>`).join('')||'<div class="add-hint">＋ Adicionar</div>'}</td>`}
function openPersonModal(k){editing=k;const [,day,time]=k.split('|');$('#modal').innerHTML=`<div class="modal-bg"><div class="modal"><button class="close">×</button><h3>Adicionar interessado</h3><div style="color:var(--muted)">${day} • ${time}</div><div class="stack"><label>Nome completo<input id="personName" class="field block" autocomplete="name"></label><label>Telefone / WhatsApp<input id="personPhone" class="field block" inputmode="tel" autocomplete="tel"></label><button class="btn dark" id="addPerson">Adicionar neste horário</button></div></div></div>`;$('.modal .close').onclick=closeModal;$('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal()};$('#addPerson').onclick=()=>addPerson(k);$('#personName').focus()}
function closeModal(){$('#modal').innerHTML='';editing=null}
function addPerson(k){const name=$('#personName').value.trim(),phone=$('#personPhone').value.trim();if(!name||!phone)return toast('Preencha nome e telefone.');(data.entries[k]??=[]).push({id:uid(),name,phone});persist();closeModal();renderSchedule()}
function removePerson(k,id){data.entries[k]=(data.entries[k]||[]).filter(p=>p.id!==id);if(!data.entries[k].length)delete data.entries[k];persist();renderSchedule()}
function applyAuto(){const name=$('#autoName').value.trim(),phone=$('#autoPhone').value.trim();if(!name||!phone)return toast('Preencha nome e telefone.');if(!selected.length)return toast('Selecione pelo menos um horário.');selected.forEach(k=>(data.entries[k]??=[]).push({id:uid(),name,phone}));selected=[];autoMode=false;persist();renderSchedule();toast('Cliente adicionado aos horários selecionados.')}
function downloadBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`agenda-escola-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function cloudDialog(){const connected=cloud.connected;$('#modal').innerHTML=`<div class="modal-bg"><div class="modal"><button class="close">×</button><h3>Sincronização com Google Drive</h3>${connected?`<div class="cloud-box"><b>✓ Conectado</b><div class="notice">Os dados são salvos no espaço privado do aplicativo no seu Drive.</div></div><div class="stack"><button class="btn dark" id="syncNow">Sincronizar agora</button><button class="btn" id="loadDrive">Carregar dados do Drive</button><button class="btn danger" id="disconnect">Desconectar</button></div>`:`<p>Para ativar, crie um Client ID OAuth do tipo “Aplicativo da Web” no Google Cloud e informe-o abaixo.</p><label>Google OAuth Client ID<input id="clientId" class="field block config-code" value="${esc(cloud.clientId)}" placeholder="000000000000-xxxxx.apps.googleusercontent.com"></label><div class="notice">Adicione o endereço onde este arquivo será hospedado às “Origens JavaScript autorizadas”. Para testar localmente, use um servidor web, não abra apenas com file://.</div><div class="stack"><button class="btn dark" id="connect">Conectar e sincronizar</button><button class="btn" id="importBackup">Importar backup JSON</button><input class="hidden" type="file" id="fileInput" accept="application/json"></div>`}</div></div>`;$('.modal .close').onclick=closeModal;$('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal()};if(connected){$('#syncNow').onclick=saveDrive;$('#loadDrive').onclick=()=>loadDrive(true);$('#disconnect').onclick=disconnectDrive}else{$('#connect').onclick=connectDrive;$('#importBackup').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=importBackup}}
function connectDrive(){cloud.clientId=$('#clientId').value.trim();if(!cloud.clientId)return toast('Informe o Client ID OAuth.');if(!window.google?.accounts?.oauth2)return toast('A biblioteca do Google ainda não carregou.');localStorage.setItem('agenda-google-client-id',cloud.clientId);setCloudUI('connecting');cloud.tokenClient=google.accounts.oauth2.initTokenClient({client_id:cloud.clientId,scope:'https://www.googleapis.com/auth/drive.appdata',callback:async r=>{if(r.error){clearCloudSession();return toast('Não foi possível autorizar o Google Drive.')}rememberCloudSession(r);cloud.connected=true;await findDriveFile();if(cloud.fileId){confirm('Já existe uma agenda no Drive. Carregar agora? Cancelar mantém os dados deste navegador.')?await loadDrive(false):await saveDrive()}else await saveDrive();setCloudUI('connected');closeModal();render();toast('Google Drive conectado.')}});cloud.tokenClient.requestAccessToken({prompt:'consent'})}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:`Bearer ${cloud.token}`,...(opt.headers||{})}});if(!r.ok){if(r.status===401)clearCloudSession();throw new Error(await r.text())}return r}
async function findDriveFile(){try{const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`),r=await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,modifiedTime)`),j=await r.json();cloud.fileId=j.files?.[0]?.id||null}catch(e){console.error(e);toast('Erro ao procurar o arquivo no Drive.')}}
async function saveDrive(force=false){if(!cloud.connected||cloud.saving)return;cloud.saving=true;$('#saveStatus').textContent='Verificando versão no Google Drive...';try{if(cloud.fileId&&!force){const remote=await fetchDriveDocument(),remoteRevision=Number(remote?._sync?.revision||0);if(remoteRevision!==baseRevision){const result=mergeDocuments(baseSnapshot,data,remote);cloud.saving=false;showExternalChange('Outra pessoa alterou a agenda. Revise a combinação antes de continuar.');return openConflictDialog(result,remote)}}const nextRevision=Math.max(baseRevision,Number(data._sync?.revision||0))+1;data=ensureSync(data);data._sync={revision:nextRevision,updatedAt:new Date().toISOString(),updatedBy:DEVICE_ID};const metadata={name:DRIVE_FILE,parents:cloud.fileId?undefined:['appDataFolder']},boundary='agenda_boundary_'+Date.now(),body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data)}\r\n--${boundary}--`,url=cloud.fileId?`https://www.googleapis.com/upload/drive/v3/files/${cloud.fileId}?uploadType=multipart`:'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',r=await api(url,{method:cloud.fileId?'PATCH':'POST',headers:{'Content-Type':`multipart/related; boundary=${boundary}`},body}),j=await r.json();cloud.fileId=j.id||cloud.fileId;if(cloud.fileId)sessionStorage.setItem('agenda-drive-file-id',cloud.fileId);baseSnapshot=structuredClone(data);baseRevision=nextRevision;hasUnsavedChanges=false;localStorage.setItem(STORAGE,JSON.stringify(data));await saveRollingBackup();setCloudUI('connected')}catch(e){console.error(e);$('#saveStatus').textContent='Falha ao sincronizar';toast('Falha ao salvar no Google Drive. Suas mudanças continuam neste navegador.')}finally{cloud.saving=false}}
async function loadDrive(confirmReplace=true){if(confirmReplace&&hasUnsavedChanges&&!confirm('Há mudanças locais. Substituir pelos dados do Google Drive?'))return;try{if(!cloud.fileId)await findDriveFile();if(!cloud.fileId)return toast('Nenhum arquivo foi encontrado no Drive.');const j=await fetchDriveDocument();validate(j);data=ensureSync(j);baseSnapshot=structuredClone(data);baseRevision=Number(data._sync?.revision||0);hasUnsavedChanges=false;active=data.tabs[0]?.id;localStorage.setItem(STORAGE,JSON.stringify(data));closeModal();render();toast('Dados carregados do Google Drive.')}catch(e){console.error(e);toast('Não foi possível carregar os dados do Drive.')}}
function backupBucketKey(now=Date.now()){return Math.floor(now/BACKUP_INTERVAL)*BACKUP_INTERVAL}
function backupName(bucket){const d=new Date(bucket),pad=n=>String(n).padStart(2,'0');return `${BACKUP_PREFIX}${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.json`}
async function createDriveJson(name,payload){const metadata={name,parents:['appDataFolder']},boundary='agenda_backup_'+Date.now(),body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,createdTime,modifiedTime,size',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${boundary}`},body});return r.json()}
async function updateDriveJson(id,payload){const r=await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id,name,createdTime,modifiedTime,size`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return r.json()}
async function saveRollingBackup(){if(!cloud.connected||!cloud.token)return;const bucket=backupBucketKey();try{if(cloud.backupBucket!==bucket){cloud.backupBucket=bucket;cloud.backupFileId=null}if(!cloud.backupFileId){const old=await findBackupForBucket(bucket);if(old)cloud.backupFileId=old.id}const payload={format:'agenda-pulsarte-backup-v1',createdAt:new Date().toISOString(),bucketStart:new Date(bucket).toISOString(),data};if(cloud.backupFileId)await updateDriveJson(cloud.backupFileId,payload);else cloud.backupFileId=(await createDriveJson(backupName(bucket),payload)).id;sessionStorage.setItem('agenda-backup-bucket',String(bucket));sessionStorage.setItem('agenda-backup-file-id',cloud.backupFileId)}catch(e){console.error(e);toast('Agenda salva, mas o backup rotativo falhou.')}}
async function findBackupForBucket(bucket){const q=encodeURIComponent(`name='${backupName(bucket)}' and trashed=false`),r=await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,createdTime,modifiedTime,size)&pageSize=10`),j=await r.json();return j.files?.[0]||null}
async function listBackups(){const q=encodeURIComponent(`name contains '${BACKUP_PREFIX}' and trashed=false`),fields=encodeURIComponent('nextPageToken,files(id,name,createdTime,modifiedTime,size)'),all=[];let token='';do{const r=await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&orderBy=createdTime%20desc&pageSize=100&fields=${fields}${token?`&pageToken=${encodeURIComponent(token)}`:''}`),j=await r.json();all.push(...(j.files||[]));token=j.nextPageToken||''}while(token);return all}
function formatBackupDate(v){return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}
function formatBytes(v){const n=+v||0;return n<1024?`${n} B`:`${(n/1024).toFixed(1)} KB`}
async function renderBackups(){const c=$('#content');c.innerHTML=`<div class="toolbar"><div><h2>Backups do Google Drive</h2><p>Uma versão é criada a cada intervalo de 10 minutos e atualizada a cada mudança nesse intervalo.</p></div></div>${cloud.connected?'<div class="empty">Carregando versões...</div>':'<div class="empty"><b>Google Drive desconectado.</b><br>Conecte o Drive para gerenciar backups.</div>'}`;if(!cloud.connected)return;try{const files=await listBackups();c.innerHTML=`<div class="toolbar"><div><h2>Backups do Google Drive</h2><p>${files.length} ${files.length===1?'versão disponível':'versões disponíveis'}. Antes de restaurar, a agenda atual é preservada automaticamente.</p></div><div class="row"><button class="btn" id="refreshBackups">↻ Atualizar</button><button class="btn dark" id="backupNow">＋ Backup agora</button></div></div><div class="card"><div class="stack">${files.map((f,i)=>`<div class="person"><div><b>${i===0?'Mais recente • ':''}${formatBackupDate(f.createdTime)}</b><span style="display:block;color:var(--muted);font-size:12px">Atualizado: ${formatBackupDate(f.modifiedTime)} • ${formatBytes(f.size)}</span></div><div class="row"><button class="btn small" data-restore="${f.id}">Restaurar</button><button class="btn danger small" data-delete-backup="${f.id}">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum backup encontrado.</div>'}</div></div>`;wireBackupButtons()}catch(e){console.error(e);c.innerHTML='<div class="empty">Não foi possível carregar os backups. Reconecte o Drive.</div>'}}
function wireBackupButtons(){$('#refreshBackups')?.addEventListener('click',renderBackups);$('#backupNow')?.addEventListener('click',createManualBackup);document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreBackup(b.dataset.restore));document.querySelectorAll('[data-delete-backup]').forEach(b=>b.onclick=()=>deleteBackup(b.dataset.deleteBackup))}
async function createManualBackup(){if(!cloud.connected)return toast('Conecte o Google Drive.');try{await createManualBackupSilent('manual');toast('Backup manual criado.');renderBackups()}catch(e){console.error(e);toast('Não foi possível criar o backup.')}}
async function createManualBackupSilent(reason){const stamp=new Date().toISOString().replace(/[:.]/g,'-');return createDriveJson(`${BACKUP_PREFIX}${reason}-${stamp}.json`,{format:'agenda-pulsarte-backup-v1',createdAt:new Date().toISOString(),manual:true,reason,data})}
async function restoreBackup(id){if(!confirm('Restaurar esta versão? A agenda atual será preservada antes da restauração.'))return;try{await createManualBackupSilent('antes-restauracao');const payload=await (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(),restored=payload.data||payload;validate(restored);data=restored;active=data.tabs[0]?.id;persist(false);await saveDrive();view='dashboard';render();toast('Backup restaurado e sincronizado.')}catch(e){console.error(e);toast('Não foi possível restaurar o backup.')}}
async function deleteBackup(id){if(!confirm('Excluir permanentemente este backup? Esta ação não pode ser desfeita.'))return;try{await api(`https://www.googleapis.com/drive/v3/files/${id}`,{method:'DELETE'});if(cloud.backupFileId===id){cloud.backupFileId=null;cloud.backupBucket=null}toast('Backup excluído.');renderBackups()}catch(e){console.error(e);toast('Não foi possível excluir o backup.')}}

function disconnectDrive(){cloud.token=null;cloud.fileId=null;cloud.connected=false;$('#saveStatus').textContent='Salvo neste navegador';closeModal();render();toast('Google Drive desconectado.')}
function validate(j){if(!j||!Array.isArray(j.tabs)||typeof j.entries!=='object')throw new Error('Arquivo inválido')}
function importBackup(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const j=JSON.parse(reader.result);validate(j);data=j;active=data.tabs[0]?.id;persist();closeModal();render();toast('Backup importado.')}catch{toast('O arquivo selecionado não é um backup válido.')}};reader.readAsText(f)}
$('#cloudBtn').onclick=cloudDialog;$('#backupBtn').onclick=downloadBackup;render();setCloudUI('disconnected');window.addEventListener('load',()=>setTimeout(restoreCloudSession,300));
window.addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue='Lembrou de fazer o backup? Se sim, pode sair do site. Se não, faça o backup antes de sair.';return e.returnValue});
setInterval(async()=>{if(!cloud.connected||cloud.saving||hasUnsavedChanges||!cloud.fileId)return;try{const remote=await fetchDriveDocument(),rev=Number(remote?._sync?.revision||0);if(rev>baseRevision){showExternalChange('A agenda foi atualizada em outro dispositivo. Carregando a versão mais recente...');data=remote;baseSnapshot=structuredClone(remote);baseRevision=rev;localStorage.setItem(STORAGE,JSON.stringify(data));render()}}catch(e){console.error(e)}},30000);
</script>
