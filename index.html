<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e2b900">
  <title>Agenda da Escola de Dança</title>
  <style>
    :root{--bg:#fbfaf5;--card:#fff;--text:#1d1d1f;--muted:#6f6858;--line:#e8dfc7;--dark:#171717;--pink:#e0b600;--pink2:#fff4bd;--red:#c62828;--green:#2e7d32;--gold:#e0b600;--gold-deep:#b58b00;--gold-soft:#fff8d8;--shadow:0 10px 28px rgba(77,58,0,.09)}
    *{box-sizing:border-box} body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}
    button,input,select{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .header,.wrap{max-width:1500px;margin:auto;padding:16px 20px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;background:var(--pink);color:#fff;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.top-actions,.nav,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 13px;font-weight:700}.btn:hover{background:#f8fafc}.btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.status{font-size:12px;color:var(--muted)}.drive-disconnected{background:#dc2626!important;color:#fff!important;border-color:#b91c1c!important;animation:driveShake 1.8s ease-in-out infinite,drivePulse 1.2s ease-in-out infinite}.drive-connected{background:#dcfce7!important;color:#166534!important;border-color:#86efac!important;animation:none!important}.drive-connecting{background:#fef3c7!important;color:#92400e!important;border-color:#fcd34d!important;animation:drivePulse 1.2s ease-in-out infinite}@keyframes drivePulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.18)}50%{box-shadow:0 0 0 7px rgba(220,38,38,0)}}@keyframes driveShake{0%,86%,100%{transform:translateX(0)}89%{transform:translateX(-3px)}92%{transform:translateX(3px)}95%{transform:translateX(-2px)}98%{transform:translateX(2px)}}
    .wrap{padding-top:20px}.nav{margin-bottom:18px}.tab-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px}.active{box-shadow:0 0 0 2px var(--dark)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{font-size:24px;margin:0}.toolbar p{margin:3px 0 0;color:var(--muted)}
    label{font-weight:700;font-size:12px}.field{border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;background:#fff;color:var(--text);outline:none}.field:focus{border-color:#f472b6;box-shadow:0 0 0 3px #fce7f3}.field.block{width:100%;margin-top:5px}
    .grid-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.demand-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.pill{background:var(--pink2);color:#9d174d;border-radius:100px;padding:5px 10px;font-weight:800}.person{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#f8fafc;border-radius:10px;margin-top:7px}.person a{color:#475467;text-decoration:none}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:16px;background:#fff}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}table{border-collapse:collapse;min-width:1100px;width:100%}th{background:#f1f5f9;text-align:left;padding:12px;position:sticky;top:0;z-index:3}th:first-child{left:0;z-index:5}td{min-width:170px;height:113px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:7px;vertical-align:top;cursor:pointer}td:hover{background:#fafafa}.time{position:sticky;left:0;z-index:2;min-width:86px;background:#fff;border-top:1px solid var(--line);padding:12px;vertical-align:top}.cell-person{position:relative;background:#f1f5f9;border-radius:9px;padding:7px 25px 7px 8px;margin-bottom:5px;font-size:12px}.cell-person b,.cell-person span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell-person span{color:var(--muted)}.x{position:absolute;right:5px;top:5px;border:0;background:transparent;color:var(--red);font-weight:900}.add-hint{height:82px;display:grid;place-items:center;color:#98a2b3;font-size:12px}.selected{background:#fce7f3!important;box-shadow:inset 0 0 0 2px #ec4899}
    .auto{margin-bottom:14px;border:1px solid #f9a8d4;background:#fdf2f8;border-radius:16px;padding:14px}.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px}.modal{background:#fff;border-radius:18px;width:min(480px,100%);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}.modal h3{margin:0;font-size:19px}.modal .close{float:right;border:0;background:transparent;font-size:24px}.stack{display:grid;gap:12px;margin-top:18px}.manage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.manage-item{display:flex;gap:8px;align-items:center;background:#f8fafc;border-radius:12px;padding:10px}.manage-item .field{min-width:0;flex:1}.color{width:42px;height:38px;border:0;background:transparent}.notice{font-size:12px;color:var(--muted);margin-top:10px}.cloud-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:13px;margin-top:12px}.config-code{font-family:ui-monospace,SFMono-Regular,monospace;font-weight:400}.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#172033;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow)}
    @media(max-width:760px){.header{align-items:flex-start}.top-actions{justify-content:flex-end}.status{width:100%;text-align:right}.grid-cards,.manage-grid{grid-template-columns:1fr}.brand p{display:none}.wrap,.header{padding-left:12px;padding-right:12px}.toolbar h2{font-size:21px}.person{display:block}.person a{display:block;margin-top:3px}}

    /* Tema visual Pulsarte: dourado, preto, branco e formas inspiradas na marca. */
    body{background:linear-gradient(135deg,#fff 0%,#fbfaf5 42%,#fff8d8 100%);background-attachment:fixed}
    header{background:rgba(255,255,255,.94);border-bottom:1px solid rgba(224,182,0,.35);box-shadow:0 4px 18px rgba(77,58,0,.06)}
    .brand{gap:15px}.logo{display:flex;align-items:center;justify-content:center;width:132px;height:58px;padding:3px 5px;border-radius:12px;background:#fff;color:inherit;overflow:hidden;box-shadow:none}
    .logo img{display:block;width:100%;height:100%;object-fit:contain}
    .brand h1{color:#171717;font-weight:800;letter-spacing:-.02em}.brand p{color:#7a6b3b}
    .btn{border-color:#ded6bd;background:#fff;color:#211f19;box-shadow:0 1px 0 rgba(77,58,0,.03);transition:background .18s,border-color .18s,transform .18s,box-shadow .18s}
    .btn:hover{background:#fff8d8;border-color:#d8ae00;box-shadow:0 5px 14px rgba(181,139,0,.12)}
    .btn:active{transform:translateY(1px)}
    .btn.dark{background:#171717;color:#fff;border-color:#171717}.btn.dark:hover{background:#2b2b2b;border-color:#2b2b2b}
    .btn.pink{background:linear-gradient(135deg,#f2cf18,#d8aa00);color:#171717;border-color:#c99c00}.btn.pink:hover{background:linear-gradient(135deg,#f8dc35,#e0b600)}
    .active{box-shadow:0 0 0 2px #e0b600}
    .card,.table-wrap{border-color:#e8dfc7}.card{position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(#f3cf17,#b58b00)}
    .field{border-color:#d9d0b8}.field:focus{border-color:#d4aa00;box-shadow:0 0 0 3px rgba(224,182,0,.20)}
    .pill{background:#fff1a8;color:#6f5400;border:1px solid #ead36a}
    .person,.manage-item,.cell-person{background:#faf7ed}
    th{background:#f5f0df;color:#28251c}.time{background:#fffdf7}td:hover{background:#fffaf0}
    .selected{background:#fff3ad!important;box-shadow:inset 0 0 0 2px #d6a900}
    .auto{border-color:#e2bd24;background:#fff8d8}
    .modal{border:1px solid #eadb9d}.modal-bg{background:rgba(20,18,11,.58)}
    .cloud-box{background:#fff9df;border-color:#ead36a}.toast{background:#171717;border-left:4px solid #e0b600}
    ::selection{background:#f2d446;color:#171717}
    @media(max-width:760px){.logo{width:94px;height:48px}.brand{gap:9px}}

    .old-toggle{display:flex;align-items:center;gap:8px;border:1px solid #8edbe8;background:#ecfbfd;border-radius:11px;padding:9px 12px;font-weight:800;color:#126071}.old-toggle input{accent-color:#17a9c0}.cell-person.old,.person.old{background:#d9f7fb!important;border:1px solid #8edbe8}.old-badge{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#78d8e7;color:#074c59;font-size:10px;font-weight:900}.dashboard-section{margin-top:24px}.dashboard-section h3{margin:0 0 10px;font-size:20px}.import-modal{width:min(920px,100%);max-height:90vh;overflow:auto}.import-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.issue{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffdf7}.issue strong{display:block;margin-bottom:7px}.issue .field{width:100%;margin-top:5px}.import-summary{background:#fff8d8;border:1px solid #ead36a;border-radius:12px;padding:12px}.btn.cyan{background:#d9f7fb;border-color:#78d8e7;color:#075664}.btn.cyan.active{background:#78d8e7;color:#063b43;box-shadow:0 0 0 2px #1594aa}.floating-days-header{position:fixed;z-index:19;overflow:hidden;background:#f5f0df;border:1px solid var(--line);border-bottom-color:#d4aa00;box-shadow:0 7px 16px rgba(77,58,0,.13);pointer-events:none}.floating-days-header table{margin:0;table-layout:fixed;min-width:1100px}.floating-days-header th{position:static;box-sizing:border-box;border:0;border-right:1px solid var(--line);white-space:nowrap}
    @media(max-width:760px){.import-grid{grid-template-columns:1fr}}

    /* Bloqueio de segurança enquanto o Google Drive não estiver sincronizado. */
    .drive-lock{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(78,78,78,.60);backdrop-filter:grayscale(1) blur(4px);-webkit-backdrop-filter:grayscale(1) blur(4px);cursor:not-allowed}
    .drive-lock.hidden{display:none!important}
    .drive-lock-card{max-width:520px;padding:22px 26px;border:1px solid rgba(255,255,255,.45);border-radius:18px;background:rgba(28,28,28,.88);box-shadow:0 22px 60px rgba(0,0,0,.34);color:#fff;text-align:center;pointer-events:none}
    .drive-lock-card strong{display:block;margin-bottom:7px;font-size:20px}.drive-lock-card span{display:block;color:#eee;line-height:1.55}
    body.drive-locked{overflow:hidden}body.drive-locked #cloudBtn{position:relative;z-index:61;pointer-events:auto;cursor:pointer}body.drive-locked header{z-index:60}body.drive-locked #modal{position:relative;z-index:70}body.drive-locked .modal-bg{z-index:70}

    /* Estado visual do botão de backups conforme a idade do último backup confirmado. */
    .backup-fresh{background:#dcfce7!important;color:#166534!important;border-color:#86efac!important;animation:none!important;box-shadow:none!important}
    .backup-stale{background:#dc2626!important;color:#fff!important;border-color:#b91c1c!important;animation:driveShake 1.8s ease-in-out infinite,drivePulse 1.2s ease-in-out infinite}

    /* Linhas de disponibilidade por periodo e filtro da Visao geral. */
    tr.period-row th.time{background:#fff3ad;color:#5f4900;font-weight:900}
    tr.period-row td{background:#fffdf1;border-top-color:#ead36a}
    tr.period-row td:hover{background:#fff8d8}
    .dashboard-filter{display:flex;gap:6px;padding:5px;border:1px solid #ded6bd;border-radius:13px;background:#fff}
    .dashboard-filter .btn{box-shadow:none}
    .period-note{margin:0 0 14px;padding:11px 13px;border:1px solid #ead36a;border-radius:12px;background:#fff9df;color:#6f5400}
  </style>
</head>

<script>
'use strict';
const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const PERIODS=['GERAL','MANHA','TARDE','NOITE'];
const TIMES=['05:00','05:30','06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30','23:00'];
const STORAGE='agenda-escola-danca-v1', DRIVE_FILE='agenda-escola-danca.json', BACKUP_PREFIX='agenda-backup-', BACKUP_INTERVAL=10*60*1000, BACKUP_FRESH_MS=60*1000, LAST_BACKUP_KEY='agenda-last-successful-backup-at';
const initial={tabs:[{id:'ballet',name:'Ballet Clássico',color:'#ec4899'},{id:'jazz',name:'Jazz',color:'#8b5cf6'}],entries:{}};
let data=load(), view='dashboard', active=data.tabs[0]?.id, minimum=2, autoMode=false, selected=[], manageOpen=false, editing=null, concatenateOld=false, importRows=[], dashboardMode='time';
let cloud={clientId:localStorage.getItem('agenda-google-client-id')||'',token:sessionStorage.getItem('agenda-drive-token')||null,fileId:sessionStorage.getItem('agenda-drive-file-id')||null,expiresAt:+sessionStorage.getItem('agenda-drive-expires-at')||0,connected:false,saving:false,tokenClient:null,backupFileId:sessionStorage.getItem('agenda-backup-file-id')||null,backupBucket:+sessionStorage.getItem('agenda-backup-bucket')||null,backups:[],synced:false};
let lastSuccessfulBackupAt=+localStorage.getItem(LAST_BACKUP_KEY)||0, backupFreshnessTimer=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now();
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||structuredClone(initial)}catch{return structuredClone(initial)}}
function persist(sync=true){localStorage.setItem(STORAGE,JSON.stringify(data));$('#saveStatus').textContent=cloud.connected?'Salvo localmente • sincronizando':'Salvo neste navegador'; if(sync&&cloud.connected)debouncedDriveSave();}
let saveTimer;function debouncedDriveSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveDrive,900)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function updateDriveLock(){const locked=!cloud.synced;document.body.classList.toggle('drive-locked',locked);const lock=$('#driveLock');if(lock)lock.classList.toggle('hidden',!locked);const main=document.querySelector('main');if(main)main.inert=locked;['#bulkBtn','#backupBtn'].forEach(sel=>{const el=$(sel);if(el)el.inert=locked})}
function setCloudUI(state){const b=$('#cloudBtn');if(!b)return;b.classList.remove('drive-disconnected','drive-connected','drive-connecting');if(state==='connected'&&cloud.synced){b.classList.add('drive-connected');b.textContent='✓ Google Drive sincronizado';$('#saveStatus').textContent='Sincronizado com Google Drive'}else if(state==='connecting'||(state==='connected'&&!cloud.synced)){b.classList.add('drive-connecting');b.textContent='↻ Conectando ao Google Drive';$('#saveStatus').textContent='Verificando Google Drive...'}else{b.classList.add('drive-disconnected');b.textContent=cloud.clientId?'⚠ Reconectar Google Drive':'⚠ Conectar Google Drive';$('#saveStatus').textContent='Google Drive desconectado'}updateDriveLock()}
function rememberCloudSession(r){cloud.token=r.access_token;cloud.expiresAt=Date.now()+(+r.expires_in||3600)*1000-60000;sessionStorage.setItem('agenda-drive-token',cloud.token);sessionStorage.setItem('agenda-drive-expires-at',String(cloud.expiresAt))}
function clearCloudSession(){cloud.token=null;cloud.fileId=null;cloud.expiresAt=0;cloud.connected=false;cloud.synced=false;['agenda-drive-token','agenda-drive-file-id','agenda-drive-expires-at','agenda-backup-file-id','agenda-backup-bucket'].forEach(x=>sessionStorage.removeItem(x));cloud.backupFileId=null;cloud.backupBucket=null;setCloudUI('disconnected')}
async function restoreCloudSession(){if(!cloud.clientId||!cloud.token||Date.now()>=cloud.expiresAt)return clearCloudSession();setCloudUI('connecting');try{cloud.connected=true;cloud.synced=false;await findDriveFile();if(cloud.fileId)await loadDrive(false);else await saveDrive();setCloudUI('connected')}catch(e){console.error(e);clearCloudSession()}}

function key(tab,day,time){return `${tab}|${day}|${time}`}
function markBackupSuccessful(at=Date.now()){lastSuccessfulBackupAt=at;localStorage.setItem(LAST_BACKUP_KEY,String(at));updateBackupButtonUI()}
function updateBackupButtonUI(){const b=$('#backupViewBtn');if(!b)return;const fresh=lastSuccessfulBackupAt>0&&(Date.now()-lastSuccessfulBackupAt)<BACKUP_FRESH_MS;b.classList.toggle('backup-fresh',fresh);b.classList.toggle('backup-stale',!fresh);b.title=fresh?'Backup confirmado há menos de 1 minuto.':'O último backup confirmado foi feito há mais de 1 minuto.'}
function startBackupFreshnessMonitor(){clearInterval(backupFreshnessTimer);updateBackupButtonUI();backupFreshnessTimer=setInterval(updateBackupButtonUI,1000)}
function render(){clearFloatingScheduleHeader();renderNav();$('#manage').classList.toggle('hidden',!manageOpen);if(manageOpen)renderManage();view==='dashboard'?renderDashboard():view==='backups'?renderBackups():renderSchedule()}
function renderNav(){const nav=$('#nav');nav.innerHTML=`<button class="btn ${view==='dashboard'?'active dark':''}" data-view="dashboard">▦ Visão geral</button><button class="btn ${view==='backups'?'active dark':''}" id="backupViewBtn" data-view="backups">⟲ Backups (SALVAR ANTES DE FECHAR)</button>`+data.tabs.map(t=>`<button class="btn ${view==='schedule'&&active===t.id?'active':''}" data-tab="${t.id}"><i class="tab-dot" style="background:${t.color}"></i>${esc(t.name)}</button>`).join('')+`<button class="btn" id="addTab">＋</button><button class="btn" id="manageBtn">⚙</button>`;nav.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;autoMode=false;selected=[];render()}));nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;view='schedule';autoMode=false;selected=[];render()});$('#addTab').onclick=()=>{manageOpen=true;render();setTimeout(()=>$('#newTabName')?.focus(),0)};$('#manageBtn').onclick=()=>{manageOpen=!manageOpen;render()};updateBackupButtonUI()}
function renderManage(){const el=$('#manage');el.innerHTML=`<div class="toolbar"><div><h2>Gerenciar modalidades</h2><p>Altere nomes e cores, ou crie novas abas.</p></div><button class="btn" id="closeManage">Fechar</button></div><div class="manage-grid">${data.tabs.map(t=>`<div class="manage-item"><input class="color" type="color" value="${t.color}" data-color="${t.id}"><input class="field" value="${esc(t.name)}" data-name="${t.id}"><button class="btn danger small" data-del="${t.id}">Excluir</button></div>`).join('')}</div><div class="row" style="margin-top:14px"><input id="newTabName" class="field" placeholder="Nova modalidade"><input id="newTabColor" class="color" type="color" value="#14b8a6"><button class="btn dark" id="createTab">Adicionar modalidade</button></div>`;$('#closeManage').onclick=()=>{manageOpen=false;render()};el.querySelectorAll('[data-name]').forEach(i=>i.onchange=()=>{data.tabs.find(t=>t.id===i.dataset.name).name=i.value.trim()||'Sem nome';persist();render()});el.querySelectorAll('[data-color]').forEach(i=>i.oninput=()=>{data.tabs.find(t=>t.id===i.dataset.color).color=i.value;persist();render()});el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteTab(b.dataset.del));$('#createTab').onclick=()=>{const name=$('#newTabName').value.trim();if(!name)return toast('Digite o nome da modalidade.');const id=uid(),color=$('#newTabColor').value;data.tabs.push({id,name,color});active=id;view='schedule';manageOpen=false;persist();render()}}
function deleteTab(id){if(data.tabs.length===1)return toast('É necessário manter pelo menos uma modalidade.');if(!confirm('Excluir esta modalidade e todos os interessados dela?'))return;data.tabs=data.tabs.filter(t=>t.id!==id);Object.keys(data.entries).filter(k=>k.startsWith(id+'|')).forEach(k=>delete data.entries[k]);if(active===id)active=data.tabs[0].id;persist();render()}
function slotPeriod(time){if(PERIODS.includes(time))return time;const hour=Number(String(time).split(':')[0]);return hour<12?'MANHA':hour<18?'TARDE':'NOITE'}
function periodLabel(v){return ({GERAL:'Geral',MANHA:'Manhã',TARDE:'Tarde',NOITE:'Noite'})[v]||v}
function demandItems(filter,mode=dashboardMode){
  if(mode==='time')return Object.entries(data.entries).map(([k,p])=>{const [tabId,day,time]=k.split('|'),people=p.filter(filter);return{k,tab:data.tabs.find(t=>t.id===tabId),day,time,people}}).filter(x=>x.tab&&TIMES.includes(x.time)&&x.people.length>=minimum).sort((a,b)=>b.people.length-a.people.length);
  const grouped=new Map();
  Object.entries(data.entries).forEach(([k,p])=>{const [tabId,day,time]=k.split('|'),tab=data.tabs.find(t=>t.id===tabId);if(!tab)return;const people=p.filter(filter);if(!people.length)return;const periods=time==='GERAL'?['GERAL','MANHA','TARDE','NOITE']:[slotPeriod(time)];periods.forEach(period=>{const id=`${tabId}|${day}|${period}`,item=grouped.get(id)||{k:id,tab,day,time:period,people:[]},personKey=person=>`${norm(person.name)}|${digits(person.phone)}`,seen=new Set(item.people.map(personKey));people.forEach(person=>{const identity=personKey(person);if(!seen.has(identity)){item.people.push(person);seen.add(identity)}});grouped.set(id,item)})});
  return [...grouped.values()].filter(x=>x.people.length>=minimum).sort((a,b)=>b.people.length-a.people.length)
}

function backupBucketKey(now=Date.now()){return Math.floor(now/BACKUP_INTERVAL)*BACKUP_INTERVAL}
function backupName(bucket){const d=new Date(bucket),pad=n=>String(n).padStart(2,'0');return `${BACKUP_PREFIX}${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.json`}
async function createDriveJson(name,payload){const metadata={name,parents:['appDataFolder']},boundary='agenda_backup_'+Date.now(),body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,createdTime,modifiedTime,size',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${boundary}`},body});return r.json()}
async function updateDriveJson(id,payload){const r=await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id,name,createdTime,modifiedTime,size`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return r.json()}
async function saveRollingBackup(){if(!cloud.connected||!cloud.token)return;const bucket=backupBucketKey();try{if(cloud.backupBucket!==bucket){cloud.backupBucket=bucket;cloud.backupFileId=null}if(!cloud.backupFileId){const old=await findBackupForBucket(bucket);if(old)cloud.backupFileId=old.id}const payload={format:'agenda-pulsarte-backup-v1',createdAt:new Date().toISOString(),bucketStart:new Date(bucket).toISOString(),data};if(cloud.backupFileId)await updateDriveJson(cloud.backupFileId,payload);else cloud.backupFileId=(await createDriveJson(backupName(bucket),payload)).id;sessionStorage.setItem('agenda-backup-bucket',String(bucket));sessionStorage.setItem('agenda-backup-file-id',cloud.backupFileId);markBackupSuccessful()}catch(e){console.error(e);toast('Agenda salva, mas o backup rotativo falhou.')}}
async function findBackupForBucket(bucket){const q=encodeURIComponent(`name='${backupName(bucket)}' and trashed=false`),r=await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,createdTime,modifiedTime,size)&pageSize=10`),j=await r.json();return j.files?.[0]||null}
async function listBackups(){const q=encodeURIComponent(`name contains '${BACKUP_PREFIX}' and trashed=false`),fields=encodeURIComponent('nextPageToken,files(id,name,createdTime,modifiedTime,size)'),all=[];let token='';do{const r=await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&orderBy=createdTime%20desc&pageSize=100&fields=${fields}${token?`&pageToken=${encodeURIComponent(token)}`:''}`),j=await r.json();all.push(...(j.files||[]));token=j.nextPageToken||''}while(token);return all}
function formatBackupDate(v){return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}
function formatBytes(v){const n=+v||0;return n<1024?`${n} B`:`${(n/1024).toFixed(1)} KB`}
async function renderBackups(){const c=$('#content');c.innerHTML=`<div class="toolbar"><div><h2>Backups do Google Drive</h2><p>Uma versão é criada a cada intervalo de 10 minutos e atualizada a cada mudança nesse intervalo.</p></div></div>${cloud.connected?'<div class="empty">Carregando versões...</div>':'<div class="empty"><b>Google Drive desconectado.</b><br>Conecte o Drive para gerenciar backups.</div>'}`;if(!cloud.connected)return;try{const files=await listBackups();c.innerHTML=`<div class="toolbar"><div><h2>Backups do Google Drive</h2><p>${files.length} ${files.length===1?'versão disponível':'versões disponíveis'}. Antes de restaurar, a agenda atual é preservada automaticamente.</p></div><div class="row"><button class="btn" id="refreshBackups">↻ Atualizar</button><button class="btn dark" id="backupNow">＋ Salvar Backup</button></div></div><div class="card"><div class="stack">${files.map((f,i)=>`<div class="person"><div><b>${i===0?'Mais recente • ':''}${formatBackupDate(f.createdTime)}</b><span style="display:block;color:var(--muted);font-size:12px">Atualizado: ${formatBackupDate(f.modifiedTime)} • ${formatBytes(f.size)}</span></div><div class="row"><button class="btn small" data-restore="${f.id}">Restaurar</button><button class="btn danger small" data-delete-backup="${f.id}">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum backup encontrado.</div>'}</div></div>`;wireBackupButtons()}catch(e){console.error(e);c.innerHTML='<div class="empty">Não foi possível carregar os backups. Reconecte o Drive.</div>'}}
function wireBackupButtons(){$('#refreshBackups')?.addEventListener('click',renderBackups);$('#backupNow')?.addEventListener('click',createManualBackup);document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreBackup(b.dataset.restore));document.querySelectorAll('[data-delete-backup]').forEach(b=>b.onclick=()=>deleteBackup(b.dataset.deleteBackup))}
async function createManualBackup(){if(!cloud.connected)return toast('Conecte o Google Drive.');try{await createManualBackupSilent('manual');toast('Backup manual criado.');renderBackups()}catch(e){console.error(e);toast('Não foi possível criar o backup.')}}
async function createManualBackupSilent(reason){const stamp=new Date().toISOString().replace(/[:.]/g,'-'),result=await createDriveJson(`${BACKUP_PREFIX}${reason}-${stamp}.json`,{format:'agenda-pulsarte-backup-v1',createdAt:new Date().toISOString(),manual:true,reason,data});markBackupSuccessful();return result}
async function restoreBackup(id){if(!confirm('Restaurar esta versão? A agenda atual será preservada antes da restauração.'))return;try{await createManualBackupSilent('antes-restauracao');const payload=await (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(),restored=payload.data||payload;validate(restored);data=restored;active=data.tabs[0]?.id;persist(false);await saveDrive();view='dashboard';render();toast('Backup restaurado e sincronizado.')}catch(e){console.error(e);toast('Não foi possível restaurar o backup.')}}
async function deleteBackup(id){if(!confirm('Excluir permanentemente este backup? Esta ação não pode ser desfeita.'))return;try{await api(`https://www.googleapis.com/drive/v3/files/${id}`,{method:'DELETE'});if(cloud.backupFileId===id){cloud.backupFileId=null;cloud.backupBucket=null}toast('Backup excluído.');renderBackups()}catch(e){console.error(e);toast('Não foi possível excluir o backup.')}}

function disconnectDrive(){cloud.token=null;cloud.fileId=null;cloud.connected=false;cloud.synced=false;setCloudUI('disconnected');$('#saveStatus').textContent='Google Drive desconectado';closeModal();render();toast('Google Drive desconectado.')}
function validate(j){if(!j||!Array.isArray(j.tabs)||typeof j.entries!=='object')throw new Error('Arquivo inválido')}
function importBackup(e){if(!cloud.synced)return toast('Sincronize o Google Drive antes de importar um backup.');const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const j=JSON.parse(reader.result);validate(j);data=j;active=data.tabs[0]?.id;persist();closeModal();render();toast('Backup importado.')}catch{toast('O arquivo selecionado não é um backup válido.')}};reader.readAsText(f)}
$('#cloudBtn').onclick=cloudDialog;$('#bulkBtn').onclick=openBulkDialog;$('#backupBtn').onclick=downloadBackup;render();startBackupFreshnessMonitor();cloud.synced=false;setCloudUI('disconnected');window.addEventListener('load',()=>setTimeout(restoreCloudSession,300));
</script>
</body>
